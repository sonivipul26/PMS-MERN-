version: "3.8"

services:
  backend:
    build: ./backend
    container_name: project_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build: .
    container_name: project_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always